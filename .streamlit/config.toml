[server]
# Listen on all network interfaces, not just localhost,
# so other devices on the same Wi-Fi can connect.
address = "0.0.0.0"
port = 8501
# Keep a browser's session for 6 hours after its connection drops (phone locked,
# app switched, tab in the background), instead of Streamlit's 2 minutes, so a
# player who comes back finds the same page. Games are also saved to disk.
disconnectedSessionTTL = 21600
# Ping each open page every 30 s to keep its connection alive. That is
# Streamlit's default with Tornado 6.5 or newer (as on Streamlit Cloud); with an
# older Tornado it pings every second, which cost 8% of a CPU core for 100 open
# pages that did nothing else (tools/loadtest.py).
websocketPingInterval = 30

[runner]
# No full garbage collection after every script run. Streamlit does one by
# default, and every page's poll (once a second while another player acts)
# is a script run, so it made
# each poll cost 25-50 ms of CPU. With 50 browsers: 86% CPU and polls going
# unanswered with it, 18% without (tools/loadtest.py). Python's own garbage
# collector still runs as usual.
postScriptGC = false

[browser]
# Don't collect usage statistics (also stops a message after every run).
gatherUsageStats = false

[client]
# Hide the developer menu and "Deploy" button for players.
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F5F6FA"
secondaryBackgroundColor = "#ECEEF6"
textColor = "#1C2033"
borderColor = "#E3E6EF"
baseRadius = "0.75rem"
